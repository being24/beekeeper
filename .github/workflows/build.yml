# Modified by Beekeeper contributors in 2026.
name: Build and Release

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build
        # OutputPathは元プロジェクトファイルではリポジトリ外の相対パスを指しているため、
        # ビルド時のプロパティ上書きでリポジトリ内に出力先を揃える(csprojファイル自体は変更しない)
        run: msbuild Beekeeper.sln -t:Rebuild -p:Configuration=Release -p:Platform="Any CPU" -p:OutputPath=bin\Release\

      - name: Stage artifacts
        shell: cmd
        run: |
          mkdir dist
          copy bin\Release\mb_Beekeeper.dll dist\
          copy bin\Release\HybridDSP.Net.dll dist\
          copy LICENSE dist\
          copy NOTICE dist\
          copy THIRD-PARTY-NOTICES.md dist\

      - name: Package plugin zip
        # MusicBeeの「Preferences > Plugins > Add Plugin」はzipファイルでのインストールを
        # 前提としている(デスクトップ版・Microsoft Store版共通)ため、dll2つをまとめて同梱する
        shell: pwsh
        run: Compress-Archive -Path dist\mb_Beekeeper.dll, dist\HybridDSP.Net.dll, dist\LICENSE, dist\NOTICE, dist\THIRD-PARTY-NOTICES.md -DestinationPath dist\beekeeper-plugin.zip

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install MCP dependencies
        run: uv sync --frozen --python 3.12

      - name: Lint MCP server
        run: uv run --frozen ruff check src tests

      - name: Test MCP server
        run: uv run --frozen pytest -q

      - name: Package MCP server
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beekeeper-dlls
          path: dist/

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/beekeeper-plugin.zip
            dist/beekeeper_mcp-*.whl
            dist/beekeeper_mcp-*.tar.gz
