name: Build and Release

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v3

      - name: Restore NuGet packages
        # .NET Framework 4.0のReference Assemblies(Developer Pack)がランナーに
        # 同梱されていないため、Microsoft.NETFramework.ReferenceAssemblies.net40で補う
        run: nuget restore Beekeeper.sln

      - name: Build
        # OutputPathは元プロジェクトファイルではリポジトリ外の相対パスを指しているため、
        # ビルド時のプロパティ上書きでリポジトリ内に出力先を揃える(csprojファイル自体は変更しない)
        run: msbuild Beekeeper.sln -t:Rebuild -p:Configuration=Release -p:Platform="Any CPU" -p:OutputPath=bin\Release\

      - name: Stage artifacts
        shell: cmd
        run: |
          mkdir dist
          copy bin\Release\mb_Beekeeper.dll dist\
          copy bin\Release\HybridDSP.Net.dll dist\

      - name: Package plugin zip
        # MusicBeeの「Preferences > Plugins > Add Plugin」はzipファイルでのインストールを
        # 前提としている(デスクトップ版・Microsoft Store版共通)ため、dll2つをまとめて同梱する
        shell: pwsh
        run: Compress-Archive -Path dist\mb_Beekeeper.dll, dist\HybridDSP.Net.dll -DestinationPath dist\beekeeper-plugin.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beekeeper-dlls
          path: dist/

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
