[project]
name = "beekeeper-mcp"
version = "0.1.0"
description = "Read-only MCP resources for the Beekeeper MusicBee Web API"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.scripts]
beekeeper-mcp = "beekeeper_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beekeeper_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

